<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FamilyTasks – Børneside</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fc;
  color:#202b45;
}

header{
  background:#fff;
  padding:20px;
  text-align:center;
  box-shadow:0 2px 12px #0000000b;
}

.logo{
  font-size:25px;
  font-weight:800;
  color:#5268db;
}

main{
  max-width:650px;
  margin:30px auto;
  padding:16px;
}

.card{
  background:white;
  border-radius:22px;
  padding:25px;
  margin-bottom:18px;
  box-shadow:0 5px 22px #26345b0d;
}

.center{text-align:center}

.avatar{
  font-size:65px;
  margin:10px;
}

h1{
  font-size:27px;
  margin:10px 0;
}

h2{
  font-size:21px;
  margin-top:0;
}

input{
  width:100%;
  padding:17px;
  border:2px solid #e1e5ef;
  border-radius:14px;
  font-size:24px;
  text-align:center;
  letter-spacing:10px;
  margin:15px 0;
}

button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:14px;
  background:#5268db;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:default;
}

.stats{
  display:flex;
  gap:12px;
}

.stat{
  flex:1;
  background:#f2f4ff;
  padding:18px 8px;
  border-radius:16px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:7px;
}

.task{
  padding:17px;
  border:1px solid #e8ebf3;
  border-radius:18px;
  margin:16px 0;
  overflow:hidden;
}

.task-image,
.task-video{
  width:100%;
  max-height:320px;
  aspect-ratio:1.15;
  object-fit:contain;
  display:block;
  margin:0 auto 16px;
  border-radius:14px;
  background:#f7f8fc;
}

.task-title{
  font-weight:bold;
  font-size:19px;
}

.task-info{
  color:#68738c;
  font-size:14px;
  margin-top:8px;
}

.task-description{
  line-height:1.5;
  color:#45516b;
}

.task button{
  margin-top:14px;
  background:#26945b;
}

.task button:disabled{
  background:#8992a8;
}

.reward button{
  background:#e59b27;
}

.reward button:disabled{
  background:#8992a8;
}

.status{
  margin-top:14px;
  padding:13px;
  border-radius:12px;
  font-weight:bold;
  text-align:center;
}

.status-pending{
  background:#fff4d8;
  color:#946200;
}

.status-approved{
  background:#e1f7e9;
  color:#207a43;
}

.status-rejected{
  background:#fde8e8;
  color:#b83232;
}

.message{
  margin-top:14px;
  text-align:center;
  color:#c0392b;
}

#pageMessage{
  color:#26945b;
  font-weight:bold;
}

.hidden{display:none}

.small{
  font-size:13px;
  color:#778099;
}

.section-intro{
  color:#68738c;
  line-height:1.5;
  margin-top:-8px;
  margin-bottom:15px;
}
</style>
</head>

<body>

<header>
  <div class="logo">FamilyTasks ⭐</div>
</header>

<main>

  <section class="card center" id="loginCard">
    <div class="avatar">👋</div>
    <h1>Hej!</h1>
    <p>Indtast din 4-cifrede kode for at komme ind.</p>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      maxlength="4"
      placeholder="••••"
      autocomplete="off"
    >

    <button id="loginButton">Log ind</button>
    <div class="message" id="loginMessage"></div>
  </section>

  <section id="dashboard" class="hidden">

    <div class="card center">
      <div class="avatar" id="avatar">😊</div>
      <h1 id="childName"></h1>
      <p>Her er dine opgaver og belønninger!</p>
    </div>

    <div class="card">
      <div class="stats">
        <div class="stat">
          ⭐ Stjerner
          <strong id="stars">0</strong>
        </div>

        <div class="stat">
          🏆 Point
          <strong id="points">0</strong>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Mine opgaver 📋</h2>
      <div id="taskList"></div>
    </div>

    <div class="card">
      <h2>Mine belønninger 🎁</h2>
      <p class="section-intro">
        Brug dine point og stjerner til at ønske dig en belønning!
      </p>
      <div id="rewardList"></div>
    </div>

    <button id="refreshButton">
      Opdater mine opgaver og belønninger
    </button>

    <br><br>

    <button
      id="logoutButton"
      style="background:#8992a8"
    >Log ud</button>

  </section>

  <p class="message" id="pageMessage"></p>

</main>

<script>
const SUPABASE_URL =
  "https://bhupbdwybahlkssweiht.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kTdbLZD9UmNZ_bsxSUhivQ_8bIOJ-Wa";

const params = new URLSearchParams(location.search);
const childId =
  params.get("child_id") || params.get("child");

const loginCard = document.getElementById("loginCard");
const dashboard = document.getElementById("dashboard");
const loginButton = document.getElementById("loginButton");
const pinInput = document.getElementById("pin");

function headers(){
  return {
    "Content-Type":"application/json",
    "apikey":SUPABASE_KEY
  };
}

function showError(message){
  document.getElementById("loginMessage").textContent = message;
}

function showPageMessage(message){
  document.getElementById("pageMessage").textContent = message;
}

async function callFunction(name, body){
  const response = await fetch(
    `${SUPABASE_URL}/functions/v1/${name}`,
    {
      method:"POST",
      headers:headers(),
      body:JSON.stringify(body)
    }
  );

  let data;

  try{
    data = await response.json();
  }catch{
    throw new Error("Serveren returnerede et ugyldigt svar.");
  }

  if(!response.ok){
    throw new Error(data.message || "Der opstod en fejl.");
  }

  return data;
}

function isVideoUrl(url){
  return /\.mp4(?:[?#]|$)/i.test(url);
}

function createTaskMedia(task){
  if(!task.image_url) return null;

  if(isVideoUrl(task.image_url)){
    const video = document.createElement("video");

    video.className = "task-video";
    video.src = task.image_url;
    video.controls = true;
    video.playsInline = true;
    video.preload = "metadata";

    video.onerror = () => {
      video.replaceWith(
        document.createTextNode("Videoen kunne ikke indlæses.")
      );
    };

    return video;
  }

  const image = document.createElement("img");

  image.className = "task-image";
  image.src = task.image_url;
  image.alt = "Sådan udfører du opgaven: " + task.title;
  image.loading = "lazy";

  image.onerror = () => {
    image.remove();
  };

  return image;
}

function createStatus(text, className){
  const status = document.createElement("div");

  status.className = "status " + className;
  status.textContent = text;

  return status;
}

async function submitTask(taskId, button){
  const token = sessionStorage.getItem(
    "familytasks_token_" + childId
  );

  if(!token) return;

  button.disabled = true;
  button.textContent = "Sender...";

  showPageMessage("");

  try{
    const result = await callFunction(
      "child-submit-task",
      {
        token:token,
        task_id:taskId
      }
    );

    if(!result.success){
      throw new Error(
        result.message || "Opgaven kunne ikke registreres."
      );
    }

    await loadDashboard(token);

    showPageMessage(
      result.message || "Opgaven er registreret!"
    );

  }catch(error){
    showPageMessage(error.message);

    button.disabled = false;
    button.textContent = "Jeg har udført opgaven";
  }
}

async function submitReward(rewardId, button){
  const token = sessionStorage.getItem(
    "familytasks_token_" + childId
  );

  if(!token) return;

  button.disabled = true;
  button.textContent = "Sender ønske...";

  showPageMessage("");

  try{
    const result = await callFunction(
      "child-reward-request",
      {
        token:token,
        reward_id:rewardId
      }
    );

    if(!result.success){
      throw new Error(
        result.message || "Belønningsønsket kunne ikke sendes."
      );
    }

    await loadDashboard(token);

    showPageMessage(
      result.message || "Dit belønningsønske er sendt!"
    );

  }catch(error){
    showPageMessage(error.message);

    button.disabled = false;
    button.textContent = "🎁 Ønsk denne belønning";
  }
}

function renderTasks(tasks){
  const taskList = document.getElementById("taskList");

  taskList.replaceChildren();

  if(!tasks || tasks.length === 0){
    const empty = document.createElement("p");

    empty.textContent =
      "Der er endnu ikke oprettet opgaver til dig 😊";

    taskList.appendChild(empty);
    return;
  }

  tasks.forEach(task => {
    const item = document.createElement("div");

    item.className = "task";

    const media = createTaskMedia(task);

    if(media){
      item.appendChild(media);
    }

    const title = document.createElement("div");

    title.className = "task-title";
    title.textContent = task.title;

    const info = document.createElement("div");

    info.className = "task-info";
    info.textContent =
      `⭐ ${task.stars} stjerner · 🏆 ${task.points} point`;

    item.append(title,info);

    if(task.description){
      const description = document.createElement("p");

      description.className = "task-description";
      description.textContent = task.description;

      item.appendChild(description);
    }

    const status = task.completion_status;

    if(status === "pending"){
      item.appendChild(
        createStatus(
          "⏳ Afventer godkendelse fra mor eller far",
          "status-pending"
        )
      );

    }else if(status === "approved" || status === "completed"){
      item.appendChild(
        createStatus(
          "✓ Godkendt – flot klaret!",
          "status-approved"
        )
      );

    }else if(status === "rejected"){
      item.appendChild(
        createStatus(
          "Opgaven er afvist – spørg mor eller far",
          "status-rejected"
        )
      );

    }else{
      const button = document.createElement("button");

      button.textContent = "Jeg har udført opgaven";

      button.addEventListener("click", () => {
        submitTask(task.id,button);
      });

      item.appendChild(button);
    }

    taskList.appendChild(item);
  });
}

function renderRewards(rewards, points, stars){
  const rewardList = document.getElementById("rewardList");

  rewardList.replaceChildren();

  if(!rewards || rewards.length === 0){
    const empty = document.createElement("p");

    empty.textContent =
      "Der er endnu ikke oprettet nogen belønninger 😊";

    rewardList.appendChild(empty);
    return;
  }

  rewards.forEach(reward => {
    const item = document.createElement("div");

    item.className = "task reward";

    const media = createTaskMedia(reward);

    if(media){
      item.appendChild(media);
    }

    const title = document.createElement("div");

    title.className = "task-title";
    title.textContent = reward.title;

    const info = document.createElement("div");

    info.className = "task-info";
    info.textContent =
      `🏆 ${reward.points_cost} point · ⭐ ${reward.stars_cost} stjerner`;

    item.append(title,info);

    if(reward.description){
      const description = document.createElement("p");

      description.className = "task-description";
      description.textContent = reward.description;

      item.appendChild(description);
    }

    if(reward.redemption_status === "pending"){
      item.appendChild(
        createStatus(
          "⏳ Dit ønske afventer mor eller far",
          "status-pending"
        )
      );

    }else if(reward.redemption_status === "approved"){
      item.appendChild(
        createStatus(
          "🎉 Godkendt! Spørg mor eller far, hvornår du får din belønning.",
          "status-approved"
        )
      );

    }else{
      const enoughPoints =
        Number(points) >= Number(reward.points_cost);

      const enoughStars =
        Number(stars) >= Number(reward.stars_cost);

      const button = document.createElement("button");

      if(!enoughPoints || !enoughStars){
        button.disabled = true;
        button.textContent = "Du mangler point eller stjerner";
      }else{
        button.textContent = "🎁 Ønsk denne belønning";

        button.addEventListener("click", () => {
          submitReward(reward.id,button);
        });
      }

      item.appendChild(button);
    }

    rewardList.appendChild(item);
  });
}

async function loadDashboard(token){
  const data = await callFunction(
    "child-dashboard",
    {token}
  );

  if(!data.success){
    throw new Error(
      data.message || "Sessionen er udløbet."
    );
  }

  document.getElementById("childName").textContent =
    data.child.name;

  document.getElementById("avatar").textContent =
    data.child.avatar_url || "😊";

  document.getElementById("stars").textContent =
    data.stars ?? 0;

  document.getElementById("points").textContent =
    data.points ?? 0;

  renderTasks(data.tasks, data.points, data.stars);

  renderRewards(
    data.rewards,
    data.points ?? 0,
    data.stars ?? 0
  );

  loginCard.classList.add("hidden");
  dashboard.classList.remove("hidden");
}

loginButton.addEventListener("click", async () => {
  const pin = pinInput.value.trim();

  if(!childId){
    showError("Der mangler et personligt loginlink.");
    return;
  }

  if(!/^[0-9]{4}$/.test(pin)){
    showError("Indtast præcis 4 cifre.");
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "Logger ind...";

  showError("");

  try{
    const data = await callFunction(
      "child-login",
      {
        child_id:childId,
        pin
      }
    );

    if(!data.success){
      throw new Error(data.message || "Forkert PIN.");
    }

    sessionStorage.setItem(
      "familytasks_token_" + childId,
      data.token
    );

    pinInput.value = "";

    await loadDashboard(data.token);

  }catch(error){
    showError(error.message);

  }finally{
    loginButton.disabled = false;
    loginButton.textContent = "Log ind";
  }
});

document.getElementById("refreshButton")
.addEventListener("click",async()=>{
  const token = sessionStorage.getItem(
    "familytasks_token_" + childId
  );

  if(!token) return;

  try{
    await loadDashboard(token);
    showPageMessage("");

  }catch(error){
    showPageMessage(error.message);
  }
});

document.getElementById("logoutButton")
.addEventListener("click",()=>{
  sessionStorage.removeItem(
    "familytasks_token_" + childId
  );

  dashboard.classList.add("hidden");
  loginCard.classList.remove("hidden");

  pinInput.value = "";

  showError("");
  showPageMessage("");
});

pinInput.addEventListener("keydown",event=>{
  if(event.key === "Enter"){
    loginButton.click();
  }
});

async function restoreSession(){
  if(!childId){
    showError("Dette link mangler barnets ID.");
    loginButton.disabled = true;
    return;
  }

  const token = sessionStorage.getItem(
    "familytasks_token_" + childId
  );

  if(token){
    try{
      await loadDashboard(token);

    }catch(error){
      sessionStorage.removeItem(
        "familytasks_token_" + childId
      );

      showError("Log ind igen med din PIN.");
    }
  }
}

restoreSession();
</script>

</body>
</html>
